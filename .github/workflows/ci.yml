name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check whitespace
        run: git diff --check

      - name: Smoke test glossary pack listing
        run: python scripts/init.py --list-packs

      - name: Smoke test snippet-only output
        run: python scripts/init.py --print-snippets --name demo --description x --stage new --as claude
